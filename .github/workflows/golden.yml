name: golden-playthrough

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/golden.yml'
      - '.golden/manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.*'
      - 'src/**'
      - 'packs/**'
      - 'public/**'
      - 'scripts/golden/**'
      - 'scripts/golden-import.mts'
      - 'scripts/campaign-audit.mts'
      - 'scripts/campaign-fmv-audit.mts'
      - 'scripts/playkit/**'
      - 'scripts/pack-ai-kit.mts'
      - 'scripts/visual/local-browser.mjs'
      - 'scripts/visual/playthrough.mjs'
  push:
    branches: [main]
    paths:
      - '.github/workflows/golden.yml'
      - '.golden/manifest.json'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.*'
      - 'src/**'
      - 'packs/**'
      - 'public/**'
      - 'scripts/golden/**'
      - 'scripts/golden-import.mts'
      - 'scripts/campaign-audit.mts'
      - 'scripts/campaign-fmv-audit.mts'
      - 'scripts/playkit/**'
      - 'scripts/pack-ai-kit.mts'
      - 'scripts/visual/local-browser.mjs'
      - 'scripts/visual/playthrough.mjs'
  workflow_dispatch:

jobs:
  golden-playthrough:
    name: golden-playthrough
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Cache verified golden archive and extracted campaign
        id: golden-cache
        uses: actions/cache@v4
        with:
          path: .golden
          key: golden-karkas-${{ runner.os }}-${{ hashFiles('.golden/manifest.json') }}

      - name: Install headless Chromium packages
        timeout-minutes: 8
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @sparticuz/chromium@131 playwright-core@1.49.1

      - name: Run golden checks, first clue, and mandatory one-hour soak
        timeout-minutes: 82
        run: npm run playthrough:golden

      - name: Prove cf-play rejects a warning-only fixture
        run: npm run cf-play:negative

      - name: Publish GOLD-1.15 soak boundaries
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs'

          const logPath = '_tools/reports/GOLD-1.15.log'
          if (!existsSync(logPath)) {
            console.log('::warning title=GOLD-1.15 soak boundaries::timeline log is missing')
            process.exit(0)
          }

          const records = readFileSync(logPath, 'utf8')
            .split(/\r?\n/)
            .filter(Boolean)
            .map((line) => JSON.parse(line))
          const soakRunId = records.filter((record) => record.task === 'GOLD-1.15' && record.event === 'run_start').at(-1)?.runId
          const last = (event) => records.filter((record) => record.task === 'GOLD-1.15' && record.runId === soakRunId && record.event === event).at(-1)
          const started = last('session_start')
          const ended = last('active_session_end')
          const completed = last('run_complete')
          if (!soakRunId || !started?.at || !ended?.at || !completed) {
            console.log(`::warning title=GOLD-1.15 soak boundaries::incomplete timeline for run ${soakRunId ?? 'unknown'} (session_start=${Boolean(started)} active_session_end=${Boolean(ended)} run_complete=${Boolean(completed)})`)
            process.exit(0)
          }

          const wallSeconds = (Date.parse(ended.at) - Date.parse(started.at)) / 1000
          const detail = `start=${started.at} end=${ended.at} wallSeconds=${wallSeconds.toFixed(1)} activeDurationSeconds=${completed.activeDurationSeconds} verdict=${completed.verdict}`
          console.log(`::notice title=GOLD-1.15 actual soak boundaries::${detail}`)
          if (process.env.GITHUB_STEP_SUMMARY) {
            appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### GOLD-1.15 actual soak boundaries\n\n- ${detail}\n`)
          }
          NODE

      - name: Upload GOLD-1.6 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-1.6-${{ github.run_id }}
          path: |
            _tools/reports/GOLD-1.6.md
            _tools/reports/GOLD-1.6.log
            _tools/reports/GOLD-1.6/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload GOLD-1.14 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-1.14-${{ github.run_id }}
          path: |
            _tools/reports/GOLD-1.14.md
            _tools/reports/GOLD-1.14.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload GOLD-1.15 one-hour timeline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-1.15-${{ github.run_id }}
          path: |
            _tools/reports/GOLD-1.15.md
            _tools/reports/GOLD-1.15.log
          retention-days: 14
          if-no-files-found: warn
